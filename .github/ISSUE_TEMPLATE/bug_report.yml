name: Bug report
description: Something in kvwire, the C++ transport, faultlab or bench behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues** (a late or stray RDMA write reaching another request's KV, or a way
        around faultlab's host allowlist or revert rule) must be
        reported privately; see SECURITY.md.
        Do not paste hostnames, IPs, serials or logs from hardware you are not cleared to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, scenario YAML, or a failing test.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: kvwire version / commit, Python, OS; for hardware runs, the env manifest (scrubbed).
