<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
<title id="t">kvwire: move the KV cache at line rate, stay correct when the wire fails</title>
<desc id="d">A prefill pool computes layer by layer while KV-cache blocks stream over two RDMA rails into a decode pool's paged blocks. A late write from an aborted transfer is stopped at the fence and the reused block stays intact. Illustrative, not a measurement.</desc>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#86A8FF"/><stop offset=".6" stop-color="#F0935C"/><stop offset="1" stop-color="#FF7D73"/></linearGradient></defs>
