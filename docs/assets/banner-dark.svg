<text x="32" y="78" class="kick2">RDMA KV-CACHE TRANSPORT · DISAGGREGATED INFERENCE</text>
<text x="32" y="124" class="h">Move the KV cache at line rate.</text>
<text x="32" y="156" class="h">Stay <tspan class="fc">correct</tspan> when the wire fails.</text>
<text x="32" y="190" class="sub">paged · per-layer · GPUDirect RDMA</text>
<text x="32" y="208" class="sub">→ hidden behind prefill compute</text>
<text x="32" y="226" class="sub">→ epoch-fenced: a late write never lands</text>
