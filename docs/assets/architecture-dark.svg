<text x="232" y="120" class="lbl2">never on the data path</text>
<rect x="410" y="100" width="134" height="30" rx="6" class="card"/>
<text x="477" y="120" class="lbl" text-anchor="middle">transfer registry</text>
<rect x="552" y="100" width="134" height="30" rx="6" class="card"/>
<text x="619" y="120" class="lbl" text-anchor="middle">state machine</text>
<rect x="694" y="100" width="134" height="30" rx="6" class="card"/>
<text x="761" y="120" class="lbl" text-anchor="middle">SLO admission</text>
<rect x="36" y="196" width="312" height="168" rx="10" class="box"/>
<text x="52" y="218" class="title">prefill pool · TP = p</text>
<rect x="52" y="230" width="280" height="32" rx="6" class="card"/>
<text x="192" y="251" class="lbl" text-anchor="middle">vLLM worker</text>
<rect x="52" y="272" width="280" height="32" rx="6" class="hl"/>
<text x="192" y="293" class="lbl" text-anchor="middle">kvwire connector · send</text>
<rect x="52" y="314" width="280" height="32" rx="6" class="gated"/>
<text x="192" y="335" class="lbl" text-anchor="middle">pack kernel (gated)</text>
<rect x="532" y="196" width="312" height="168" rx="10" class="box"/>
<text x="548" y="218" class="title">decode pool · TP = d</text>
<rect x="548" y="230" width="280" height="32" rx="6" class="card"/>
<text x="688" y="251" class="lbl" text-anchor="middle">vLLM worker</text>
<rect x="548" y="272" width="280" height="32" rx="6" class="hl"/>
<text x="688" y="293" class="lbl" text-anchor="middle">kvwire connector · recv</text>
