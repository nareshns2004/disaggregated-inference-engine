    .sub { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; }
    .cap { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #A3ABB8; letter-spacing: .06em; }
    .lbl { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ECE8E0; }
    .lbl2 { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #A3ABB8; }
    .title { font: 650 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #ECE8E0; }
    .box { fill: #171E29; stroke: #3B4656; stroke-width: 1.2; }
    .card { fill: #10151D; stroke: #ECE8E0; stroke-width: 1.3; }
    .wire { fill: none; stroke: #3B4656; stroke-width: 1.4; }
    .ink { fill: none; stroke: #ECE8E0; stroke-width: 1.4; }
    .sig { fill: none; stroke: #86A8FF; stroke-width: 1.6; }
    .cu { fill: none; stroke: #F0935C; stroke-width: 1.8; }
    .dash { stroke-dasharray: 4 4; }
    .fs { fill: #86A8FF; } .fc { fill: #F0935C; } .ff { fill: #FF7D73; }
    .fg { fill: #A3ABB8; } .fi { fill: #ECE8E0; } .fp { fill: #10151D; }
    .chip { fill: #10151D; stroke: #3B4656; stroke-width: 1; }
    .chipt { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; letter-spacing: .04em; }
    
    .arr { fill: none; stroke: #CFCAC0; stroke-width: 1.3; marker-end: url(#ar); }
    .ctl { fill: none; stroke: #A3ABB8; stroke-width: 1.2; stroke-dasharray: 4 3;
            marker-end: url(#arg); marker-start: url(#arg); }
    .data { fill: none; stroke: #F0935C; stroke-width: 4; }
    .hl { fill: #10151D; stroke: #F0935C; stroke-width: 2; }
    .gated { fill: #10151D; stroke: #3B4656; stroke-width: 1.2; stroke-dasharray: 4 3; }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
