<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="t d">
<title id="t">kvwire architecture</title>
<desc id="d">Clients reach a router/coordinator that holds the transfer registry, state machine and admission control, and exchanges only metadata with the pools. KV bytes move from the prefill pool's kvwire connector to the decode pool's connector over RDMA writes, layer by layer, across multiple rails, fenced by epoch. Pack and unpack kernels are gated on a measured win. faultlab injects faults into both pools.</desc>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#86A8FF"/><stop offset=".6" stop-color="#F0935C"/><stop offset="1" stop-color="#FF7D73"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CFCAC0"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0935C"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A3ABB8"/></marker></defs>
<style>
