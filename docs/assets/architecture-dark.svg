<rect x="24" y="14" width="832" height="3" rx="1.5" fill="url(#acc)"/>
<text x="32" y="46" class="kick">SYSTEM CONTEXT</text>
<text x="32" y="64" class="kick2">control plane ≠ data plane · integrate, don't fork · every byte has an epoch</text>
<rect x="36" y="86" width="120" height="58" rx="8" class="card"/>
<text x="96" y="112" class="lbl" text-anchor="middle">clients</text>
<text x="96" y="128" class="lbl2" text-anchor="middle">OpenAI API</text>
