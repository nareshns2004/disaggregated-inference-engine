<text x="688" y="335" class="lbl" text-anchor="middle">unpack kernel (gated)</text>
<path d="M192 152 L192 194" class="ctl"/>
<path d="M688 152 L688 194" class="ctl"/>
<text x="200" y="178" class="lbl2">reserve · epoch · grant</text>
<text x="696" y="178" class="lbl2">commit · abort · fence</text>
<path d="M348 288 L516 288" class="data"/>
<path d="M514 280 L530 288 L514 296 z" fill="#F0935C"/>
<text x="438" y="276" class="lbl" text-anchor="middle">RDMA WRITE</text>
<text x="438" y="308" class="lbl2" text-anchor="middle">layer-wise · multi-rail</text>
<text x="438" y="322" class="lbl2" text-anchor="middle">epoch-fenced</text>
<rect x="36" y="382" width="808" height="34" rx="8" class="card dash"/>
<text x="52" y="404" class="lbl">faultlab</text>
<text x="124" y="404" class="lbl2">kill P or D · link down / flap · forced QP error · late write · coordinator kill</text>
<line x1="300" y1="436" x2="330" y2="436" stroke="#F0935C" stroke-width="4"/>
<text x="338" y="440" class="lbl2">KV bytes (data plane)</text>
