[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kvwire"
version = "0.0.1"
description = "GPUDirect RDMA KV-cache transport, re-layout kernel and failure-aware coordinator for disaggregated LLM inference (vLLM)."
readme = "README.md"
requires-python = ">=3.10"
# Core has zero runtime dependencies on purpose: the control plane must be testable on a laptop.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]
bench = ["pyyaml>=6", "numpy>=1.26", "matplotlib>=3.8"]
native = ["pybind11>=2.13"]                         # builds transport/python bindings
gpu = ["torch>=2.4", "triton>=3.0"]                 # kernels/ (M4)
vllm = ["vllm"]                                     # pin an exact version in ADR-0001 before use

[project.scripts]
kvwire = "kvwire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kvwire", "faultlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
  "gpu: requires a CUDA GPU (skipped unless --run-gpu)",
  "multinode: requires >=2 hosts with RDMA (skipped unless --run-multinode)",
  "rxe: requires SoftRoCE / a verbs device (skipped unless --run-rxe); non-performance",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kvwire", "faultlab"]
