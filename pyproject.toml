[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kvwire"
version = "0.0.1"
description = "GPUDirect RDMA KV-cache transport, re-layout kernel and failure-aware coordinator for disaggregated LLM inference (vLLM)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "kvwire contributors" }]
keywords = ["rdma", "gpudirect", "kv-cache", "disaggregated-inference", "vllm", "llm-serving"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core has zero runtime dependencies on purpose: the control plane must be testable on a laptop.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]
bench = ["pyyaml>=6", "numpy>=1.26", "matplotlib>=3.8"]
export = ["pyarrow>=15"]                            # kvwire export --format parquet
hub = ["huggingface_hub>=0.30"]                     # kvwire export --push
native = ["pybind11>=2.13"]                         # builds transport/python bindings
gpu = ["torch>=2.4", "triton>=3.0"]                 # kernels/ (M4)
vllm = ["vllm"]                                     # pin an exact version in ADR-0001 before use

[project.urls]
Homepage = "https://github.com/nareshns2004/kvwire-disaggregated-inference-engine"
Documentation = "https://github.com/nareshns2004/kvwire-disaggregated-inference-engine/tree/main/docs"
Issues = "https://github.com/nareshns2004/kvwire-disaggregated-inference-engine/issues"
Changelog = "https://github.com/nareshns2004/kvwire-disaggregated-inference-engine/blob/main/CHANGELOG.md"

[project.scripts]
kvwire = "kvwire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kvwire", "faultlab"]

[tool.hatch.build.targets.sdist]
exclude = [".local", "*.pdf", "bench/results/*/", "build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
  "gpu: requires a CUDA GPU (skipped unless --run-gpu)",
  "multinode: requires >=2 hosts with RDMA (skipped unless --run-multinode)",
  "rxe: requires SoftRoCE / a verbs device (skipped unless --run-rxe); non-performance",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
# Typographic × and → are intentional in the generated README graphics.
"scripts/build_assets.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kvwire", "faultlab", "bench"]

[[tool.mypy.overrides]]
# Optional extras (export, hub), imported lazily; not installed in the laptop tier.
module = ["pyarrow", "pyarrow.*", "huggingface_hub"]
ignore_missing_imports = true
